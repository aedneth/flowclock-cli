name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies (zero-trust)
        run: npm ci --ignore-scripts

      - name: Dependency security audit
        # Scope to production deps: the published package ships no build tooling
        # (esbuild/tsup/vite are devDependencies, never installed by users), so
        # dev-only advisories must not block a release. `--omit=dev` audits
        # exactly what users install.
        run: npm audit --audit-level=high --omit=dev

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true

      - name: Publish to npm
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
