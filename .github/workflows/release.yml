name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies (zero-trust)
        run: npm ci --ignore-scripts

      - name: Dependency security audit
        # Scope to production deps: the published package ships no build tooling
        # (esbuild/tsup/vite are devDependencies, never installed by users), so
        # dev-only advisories must not block a release. `--omit=dev` audits
        # exactly what users install.
        run: npm audit --audit-level=high --omit=dev

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true

      - name: Publish to npm
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
